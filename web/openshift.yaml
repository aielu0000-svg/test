apiVersion: v1
kind: ServiceAccount
metadata:
  name: the-test
---
apiVersion: v1
kind: Secret
metadata:
  name: the-test-db
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: CHANGE_ME_DB_ROOT_PASSWORD
  MARIADB_PASSWORD: CHANGE_ME_DB_PASSWORD
  DB_PASSWORD: CHANGE_ME_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: the-test-admin
type: Opaque
stringData:
  INITIAL_ADMIN_USERNAME: admin
  INITIAL_ADMIN_PASSWORD: CHANGE_ME_INITIAL_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: the-test-config
data:
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_NAME: the_test
  DB_USER: the_test
  COOKIE_SECURE: "true"
  EVIDENCE_STORAGE_PATH: /var/lib/the-test/evidence
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: the-test-evidence
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  replicas: 1
  selector:
    matchLabels: { app: mariadb }
  template:
    metadata:
      labels: { app: mariadb }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          env:
            - name: MARIADB_DATABASE
              value: the_test
            - name: MARIADB_USER
              value: the_test
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: the-test-db, key: MARIADB_ROOT_PASSWORD } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: the-test-db, key: MARIADB_PASSWORD } }
          ports: [{ name: mysql, containerPort: 3306 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mariadb-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector: { app: mariadb }
  ports: [{ name: mysql, port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: the-test-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: the-test-web }
  template:
    metadata:
      labels: { app: the-test-web }
    spec:
      serviceAccountName: the-test
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: image-registry.openshift-image-registry.svc:5000/PROJECT/the-test-web:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: { name: the-test-config }
            - secretRef: { name: the-test-db }
            - secretRef: { name: the-test-admin }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          volumeMounts: [{ name: evidence, mountPath: /var/lib/the-test/evidence }]
      volumes: [{ name: evidence, persistentVolumeClaim: { claimName: the-test-evidence } }]
---
apiVersion: v1
kind: Service
metadata:
  name: the-test-web
spec:
  selector: { app: the-test-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: the-test-web
spec:
  to: { kind: Service, name: the-test-web }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
