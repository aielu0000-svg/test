                  mountPath: /operations
                  readOnly: true
                - name: evidence
                  mountPath: /evidence
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: operations
              configMap:
                name: the-test-operations
                defaultMode: 365
            - name: evidence
              persistentVolumeClaim:
                claimName: the-test-evidence
            - name: backups
              persistentVolumeClaim:
                claimName: the-test-backups
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
