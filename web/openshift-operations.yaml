                  value: /tmp
                - name: BACKUP_STORAGE_PATH
                  value: /backups
                - name: BACKUP_EVIDENCE_PATH
                  value: /evidence
              envFrom:
                - configMapRef:
                    name: the-test-config
                - secretRef:
                    name: the-test-db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
