apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: the-test-backups
  labels:
    app.kubernetes.io/part-of: the-test
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 220Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: the-test-daily-backup
  labels:
    app.kubernetes.io/name: the-test-backup
    app.kubernetes.io/part-of: the-test
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: the-test-backup
            app.kubernetes.io/part-of: the-test
        spec:
          serviceAccountName: the-test
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.redhat.io/rhel9/mariadb-1011:1
              command:
                - /bin/sh
                - /operations/backup.sh
              env:
                - name: HOME
                  value: /tmp
                - name: BACKUP_STORAGE_PATH
                  value: /backups
                - name: BACKUP_EVIDENCE_PATH
                  value: /evidence
              envFrom:
                - configMapRef:
                    name: the-test-config
                - secretRef:
                    name: the-test-db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: operations
                  mountPath: /operations
                  readOnly: true
                - name: evidence
                  mountPath: /evidence
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: operations
              configMap:
                name: the-test-operations
                defaultMode: 365
            - name: evidence
              persistentVolumeClaim:
                claimName: the-test-evidence
            - name: backups
              persistentVolumeClaim:
                claimName: the-test-backups
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
