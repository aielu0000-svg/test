apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: the-test-backups
  labels:
    app.kubernetes.io/part-of: the-test
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 150Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: the-test-operations
  labels:
    app.kubernetes.io/part-of: the-test
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    generation="$(date -u +%Y%m%dT%H%M%SZ)"
    temporary="/backups/.${generation}.creating"
    destination="/backups/${generation}"
    mkdir -p "${temporary}"
    mariadb-dump --single-transaction --skip-lock-tables --host="${DB_HOST}" --port="${DB_PORT}" --user="${DB_USER}" --password="${DB_PASSWORD}" "${DB_NAME}" > "${temporary}/database.sql"
    tar -C /evidence -czf "${temporary}/evidence.tar.gz" .
    (cd "${temporary}" && sha256sum database.sql evidence.tar.gz > SHA256SUMS)
    mv "${temporary}" "${destination}"
    find /backups -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%f\n' | sort -r | awk 'NR > 3' | while IFS= read -r expired; do
      case "${expired}" in
        [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z) rm -rf -- "/backups/${expired}" ;;
      esac
    done
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: the-test-daily-backup
  labels:
    app.kubernetes.io/name: the-test-backup
    app.kubernetes.io/part-of: the-test
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: the-test-backup
            app.kubernetes.io/part-of: the-test
        spec:
          serviceAccountName: the-test
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: registry.redhat.io/rhel9/mariadb-1011:1
              command:
                - /bin/sh
                - /operations/backup.sh
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - configMapRef:
                    name: the-test-config
                - secretRef:
                    name: the-test-db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: operations
                  mountPath: /operations
                  readOnly: true
                - name: evidence
                  mountPath: /evidence
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: operations
              configMap:
                name: the-test-operations
                defaultMode: 365
            - name: evidence
              persistentVolumeClaim:
                claimName: the-test-evidence
            - name: backups
              persistentVolumeClaim:
                claimName: the-test-backups
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
