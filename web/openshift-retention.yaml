apiVersion: batch/v1
kind: CronJob
metadata:
  name: the-test-retention-purge
  labels:
    app.kubernetes.io/name: the-test-retention
    app.kubernetes.io/part-of: the-test
spec:
  schedule: "30 3 * * *"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: the-test-retention
            app.kubernetes.io/part-of: the-test
        spec:
          serviceAccountName: the-test
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: registry.redhat.io/rhel9/mariadb-1011:1
              command:
                - /bin/sh
                - /operations/purge.sh
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - configMapRef:
                    name: the-test-config
                - secretRef:
                    name: the-test-db
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: retention
                  mountPath: /operations
                  readOnly: true
                - name: evidence
                  mountPath: /var/lib/the-test/evidence
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: retention
              configMap:
                name: the-test-retention
                defaultMode: 365
            - name: evidence
              persistentVolumeClaim:
                claimName: the-test-evidence
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
