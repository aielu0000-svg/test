<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手順書 Markdown 取込 プロトタイプ</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f5f5;
        --panel: #ffffff;
        --panel-2: #f7f7f7;
        --input-bg: #ffffff;
        --ink: #151515;
        --muted: #6a6e73;
        --line: #d2d2d2;
        --strong: #ee0000;
        --strong-hover: #be0000;
        --strong-2: #faeaea;
        --warn: #935f16;
        --warn-bg: #fff4dd;
        --blue: #0066cc;
        --blue-bg: #e7f1fa;
        --table-head: #f0f0f0;
        --group-bg: #f8f8f8;
        --row-hover: #fbfbfb;
        --code-bg: #1f1f1f;
        --code-head: #2b2b2b;
        --code-line: #4d4d4d;
        --code-text: #f4f4f4;
        --note-bg: #fff7f7;
        --shadow: 0 18px 55px rgba(28, 29, 26, 0.18);
        font-family:
          "Yu Gothic UI", "Meiryo", "Hiragino Sans", system-ui, sans-serif;
      }

      body[data-theme="dark"] {
        color-scheme: dark;
        --bg: #151515;
        --panel: #1f1f1f;
        --panel-2: #262626;
        --input-bg: #151515;
        --ink: #f2f2f2;
        --muted: #b8bbbe;
        --line: #4d4d4d;
        --strong: #ff5454;
        --strong-hover: #ff7a7a;
        --strong-2: #3d2424;
        --warn: #f0ab00;
        --warn-bg: #3d2d12;
        --blue: #73bcf7;
        --blue-bg: #17324d;
        --table-head: #292929;
        --group-bg: #242424;
        --row-hover: #292929;
        --code-bg: #0f1214;
        --code-head: #1c1f23;
        --code-line: #3c4045;
        --code-text: #e8eaed;
        --note-bg: #2d1d1d;
        --shadow: 0 18px 55px rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }

      .app {
        min-height: 100vh;
        padding: 22px;
      }

      .shell {
        min-height: calc(100vh - 44px);
        border: 1px solid var(--line);
        background: var(--panel);
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      .topbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .title-block {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 6px;
        background: var(--strong);
        color: #fff;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 6px;
        font-weight: 700;
        white-space: nowrap;
      }

      .btn.primary {
        background: var(--strong);
        border-color: var(--strong);
        color: #fff;
      }

      .btn.primary:hover {
        background: var(--strong-hover);
        border-color: var(--strong-hover);
      }

      .btn.ghost {
        background: var(--panel-2);
      }

      .control-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      input {
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--ink);
        padding: 0 10px;
      }

      .segment {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
        background: var(--input-bg);
      }

      .segment button {
        height: 38px;
        min-width: 108px;
        border: 0;
        border-right: 1px solid var(--line);
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font-weight: 700;
      }

      .segment button:last-child {
        border-right: 0;
      }

      .segment button.active {
        background: var(--strong);
        color: #fff;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(120px, 1fr));
        gap: 10px;
        padding: 14px 20px 0;
      }

      .metric {
        border: 1px solid var(--line);
        background: var(--panel-2);
        border-radius: 6px;
        padding: 10px 12px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 19px;
      }

      .table-wrap {
        padding: 14px 20px 20px;
        overflow: auto;
      }

      table {
        width: 100%;
        min-width: 980px;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--line);
        background: var(--panel);
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        text-align: left;
        vertical-align: middle;
        font-size: 14px;
      }

      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--table-head);
        color: var(--ink);
        font-size: 12px;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      tr.group-row td {
        background: var(--group-bg);
        color: var(--muted);
        font-weight: 800;
      }

      tr.step-row:hover td {
        background: var(--row-hover);
      }

      .num {
        width: 56px;
        color: var(--muted);
        font-weight: 800;
      }

      .step-name {
        min-width: 240px;
      }

      .step-button {
        border: 0;
        background: transparent;
        padding: 0;
        color: var(--ink);
        font-weight: 800;
        text-align: left;
        text-decoration: underline;
        text-decoration-color: transparent;
      }

      .step-button:hover {
        text-decoration-color: currentColor;
      }

      .time-input {
        width: 86px;
      }

      .date-input {
        width: 128px;
      }

      .duration-input {
        width: 78px;
      }

      .duration-cell {
        color: var(--blue);
        font-weight: 800;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 0 9px;
        font-size: 12px;
        font-weight: 800;
        background: var(--table-head);
        color: var(--muted);
        white-space: nowrap;
      }

      .status.running {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .status.done {
        background: var(--strong-2);
        color: var(--strong);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        height: 24px;
        border-radius: 4px;
        padding: 0 7px;
        background: var(--blue-bg);
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 30px;
        background: rgba(20, 22, 20, 0.48);
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(980px, 100%);
        max-height: min(820px, 92vh);
        display: grid;
        grid-template-rows: auto 1fr auto;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .modal-head,
      .modal-foot {
        padding: 15px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .modal-foot {
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }

      .modal-title {
        min-width: 0;
      }

      .modal-title h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }

      .modal-title p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .modal-body {
        padding: 0;
        overflow: auto;
      }

      .doc-content {
        padding: 24px 30px 34px;
      }

      .prose h3 {
        margin: 24px 0 10px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        font-size: 18px;
      }

      .prose h3:first-child {
        margin-top: 0;
        border-top: 0;
        padding-top: 0;
      }

      .prose p {
        margin: 0 0 12px;
        line-height: 1.7;
      }

      .prose ol {
        margin: 0 0 18px 1.4em;
        padding: 0;
      }

      .prose li {
        margin: 0 0 12px;
        line-height: 1.7;
        padding-left: 4px;
      }

      .note-box {
        border-left: 4px solid #ee0000;
        background: var(--note-bg);
        margin: 14px 0 20px;
        padding: 12px 14px;
      }

      .note-box strong {
        display: block;
        margin-bottom: 5px;
      }

      .codebox {
        border: 1px solid var(--code-line);
        border-radius: 3px;
        background: var(--code-bg);
        color: var(--code-text);
        overflow: hidden;
        margin: 14px 0 20px;
      }

      .codehead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--code-line);
        background: var(--code-head);
        color: #d8d8d8;
        font-size: 12px;
      }

      .codehead span {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        border-radius: 999px;
        padding: 0 8px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .codebox.lang-bash .codehead span {
        background: #1f3a22;
        color: #9be09f;
      }

      .codebox.lang-yaml .codehead span {
        background: #17324d;
        color: #73bcf7;
      }

      .codebox.lang-bash pre {
        color: #d8f5d1;
      }

      .codebox.lang-yaml pre {
        color: #d7ecff;
      }

      .copy-btn {
        width: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 28px;
        border-color: var(--code-line);
        background: transparent;
        color: #fff;
        border-radius: 3px;
        padding: 0;
        font-size: 12px;
        font-weight: 800;
      }

      .copy-btn::before {
        content: "";
        width: 13px;
        height: 13px;
        border: 1.8px solid currentColor;
        box-shadow: 4px -4px 0 -1.8px var(--code-head), 4px -4px 0 0 currentColor;
      }

      pre {
        margin: 0;
        padding: 14px 16px;
        overflow: auto;
        font-family: "Consolas", "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.6;
      }

      .stamp-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      @media (max-width: 900px) {
        .topbar,
        .control-row {
          grid-template-columns: 1fr;
        }

        .actions {
          justify-content: flex-start;
        }

        .summary {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="shell">
        <header class="topbar">
          <div class="title-block">
            <div class="mark">MD</div>
            <div>
              <h1>手順書 Markdown 取込</h1>
              <div class="subtitle">Markdownを手順一覧に変換し、予定作成と本番打刻を管理する</div>
            </div>
          </div>
          <div class="actions">
            <button class="btn ghost" id="themeToggle" type="button">ダーク</button>
            <button class="btn ghost">Markdown 取込</button>
            <button class="btn ghost">再読み込み</button>
            <button class="btn primary">保存</button>
          </div>
        </header>

        <section class="control-row">
          <div class="field">
            <label>日時表示</label>
            <div class="segment" aria-label="日時表示切替">
              <button class="active" id="plannedBtn" type="button">予定日時</button>
              <button id="actualBtn" type="button">実施日時</button>
            </div>
          </div>
          <div class="actions">
            <button class="btn ghost">全手順</button>
            <button class="btn ghost">未実施</button>
            <button class="btn ghost">完了</button>
          </div>
        </section>

        <section>
          <div class="summary">
            <div class="metric">
              <span>表示モード</span>
              <strong id="modeLabel">予定日時</strong>
            </div>
            <div class="metric">
              <span>総予定時間</span>
              <strong>02:25</strong>
            </div>
            <div class="metric">
              <span>完了</span>
              <strong>1 / 7</strong>
            </div>
            <div class="metric">
              <span>Markdown</span>
              <strong>テストデザイン.md</strong>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>手順</th>
                  <th id="startHead">予定開始</th>
                  <th id="endHead">予定終了</th>
                  <th id="durationHead">予定所要</th>
                  <th>状態</th>
                </tr>
              </thead>
              <tbody id="stepBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <div class="modal-backdrop" id="modalBackdrop">
      <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-head">
          <div class="modal-title">
            <h2 id="modalTitle">namespace作成</h2>
            <p id="modalGroup">事前準備 / OpenShift作業</p>
          </div>
          <button class="btn ghost" id="closeModal" type="button">閉じる</button>
        </header>
        <div class="modal-body">
          <div class="doc-content prose" id="modalDoc"></div>
        </div>
        <footer class="modal-foot">
          <span class="hint">開始・終了の打刻は実施日時モードの記録に反映する想定</span>
          <div class="stamp-actions">
            <button class="btn ghost" type="button">開始打刻</button>
            <button class="btn primary" type="button">終了打刻</button>
          </div>
        </footer>
      </article>
    </div>

    <script>
      const steps = [
        {
          no: "1",
          group: "事前準備",
          title: "namespace作成",
          plannedStart: "4/16 12:00",
          plannedEnd: "4/16 12:10",
          plannedDuration: "00:10",
          actualStart: "4/16 12:03",
          actualEnd: "4/16 12:12",
          actualDuration: "00:09",
          status: "完了",
          body: "dbproxy-ci 用の namespace を作成する。",
          code: "oc new-project dbproxy-ci"
        },
        {
          no: "2",
          group: "事前準備",
          title: "イメージ作成",
          plannedStart: "4/16 12:10",
          plannedEnd: "4/16 12:35",
          plannedDuration: "00:25",
          actualStart: "4/16 12:14",
          actualEnd: "",
          actualDuration: "",
          status: "実施中",
          body: "haproxy のイメージを作成する。",
          code:
            "oc -n dbproxy-ci import-image haproxy:3.3.6 \\\n  --from=docker.io/library/haproxy:3.3.6 \\\n  --confirm"
        },
        {
          no: "3",
          group: "設定投入",
          title: "ConfigMap作成",
          plannedStart: "4/16 12:35",
          plannedEnd: "4/16 12:50",
          plannedDuration: "00:15",
          actualStart: "",
          actualEnd: "",
          actualDuration: "",
          status: "未実施",
          body: "設定ファイルを ConfigMap として登録する。",
          code: "oc -n dbproxy-ci create configmap haproxy-config --from-file=haproxy.cfg"
        },
        {
          no: "4",
          group: "設定投入",
          title: "Deployment作成",
          plannedStart: "4/16 12:50",
          plannedEnd: "4/16 13:15",
          plannedDuration: "00:25",
          actualStart: "",
          actualEnd: "",
          actualDuration: "",
          status: "未実施",
          body: "Deployment を作成し、Pod が起動することを確認する。",
          code: "oc -n dbproxy-ci apply -f deployment.yaml"
        },
        {
          no: "5",
          group: "確認",
          title: "疎通確認",
          plannedStart: "4/16 13:15",
          plannedEnd: "4/16 13:35",
          plannedDuration: "00:20",
          actualStart: "",
          actualEnd: "",
          actualDuration: "",
          status: "未実施",
          body: "Service 経由で疎通できることを確認する。",
          code: "curl -I http://dbproxy-ci.example.local"
        },
        {
          no: "6",
          group: "確認",
          title: "ログ確認",
          plannedStart: "4/16 13:35",
          plannedEnd: "4/16 13:45",
          plannedDuration: "00:10",
          actualStart: "",
          actualEnd: "",
          actualDuration: "",
          status: "未実施",
          body: "Pod のログにエラーが出ていないことを確認する。",
          code: "oc -n dbproxy-ci logs deploy/haproxy"
        },
        {
          no: "7",
          group: "確認",
          title: "RHBK 認証設定の長手順確認",
          plannedStart: "4/16 13:45",
          plannedEnd: "4/16 14:25",
          plannedDuration: "00:40",
          actualStart: "",
          actualEnd: "",
          actualDuration: "",
          status: "未実施",
          body:
            "Developer Hub が Red Hat build of Keycloak で認証できるように、シークレット、app-config、検証操作を順番に確認する。",
          code:
            "oc -n rhdh get secret rhdh-secrets -o yaml\noc -n rhdh edit configmap app-config-rhdh\noc -n rhdh rollout restart deployment/rhdh"
        }
      ];

      let mode = "planned";
      const body = document.getElementById("stepBody");
      const plannedBtn = document.getElementById("plannedBtn");
      const actualBtn = document.getElementById("actualBtn");
      const modeLabel = document.getElementById("modeLabel");
      const startHead = document.getElementById("startHead");
      const endHead = document.getElementById("endHead");
      const durationHead = document.getElementById("durationHead");
      const modalBackdrop = document.getElementById("modalBackdrop");
      const themeToggle = document.getElementById("themeToggle");

      function statusClass(status) {
        if (status === "完了") return "done";
        if (status === "実施中") return "running";
        return "";
      }

      function render() {
        body.innerHTML = "";
        let currentGroup = "";
        steps.forEach((step, index) => {
          if (step.group !== currentGroup) {
            currentGroup = step.group;
            const groupRow = document.createElement("tr");
            groupRow.className = "group-row";
            groupRow.innerHTML = `<td colspan="6"># ${currentGroup}</td>`;
            body.appendChild(groupRow);
          }

          const start = mode === "planned" ? step.plannedStart : step.actualStart;
          const end = mode === "planned" ? step.plannedEnd : step.actualEnd;
          const duration = mode === "planned" ? step.plannedDuration : step.actualDuration;
          const isPlanned = mode === "planned";
          const row = document.createElement("tr");
          row.className = "step-row";
          row.innerHTML = `
            <td class="num">${step.no}</td>
            <td class="step-name"><button class="step-button" type="button" data-index="${index}">${step.title}</button></td>
            <td><input class="date-input" value="${start}" placeholder="未入力" /></td>
            <td><input class="date-input" value="${end}" placeholder="未入力" /></td>
            <td>${
              isPlanned
                ? `<input class="duration-input" value="${duration}" aria-label="予定所要時間" />`
                : `<span class="duration-cell">${duration || "-"}</span>`
            }</td>
            <td><span class="status ${statusClass(step.status)}">${step.status}</span></td>
          `;
          body.appendChild(row);
        });

        document.querySelectorAll(".step-button").forEach((button) => {
          button.addEventListener("click", () => openModal(steps[Number(button.dataset.index)]));
        });
      }

      function setMode(nextMode) {
        mode = nextMode;
        plannedBtn.classList.toggle("active", mode === "planned");
        actualBtn.classList.toggle("active", mode === "actual");
        modeLabel.textContent = mode === "planned" ? "予定日時" : "実施日時";
        startHead.textContent = mode === "planned" ? "予定開始" : "実施開始";
        endHead.textContent = mode === "planned" ? "予定終了" : "実施終了";
        durationHead.textContent = mode === "planned" ? "予定所要" : "実績所要";
        render();
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function codeBlock(label, code) {
        const language = label.toLowerCase();
        return `
          <div class="codebox lang-${language}">
            <div class="codehead">
              <span>${label}</span>
              <button class="copy-btn" type="button" aria-label="コードをコピー" title="コードをコピー"></button>
            </div>
            <pre><code>${escapeHtml(code)}</code></pre>
          </div>
        `;
      }

      function renderDoc(step) {
        if (step.no !== "7") {
          return `
            <h3 id="modal-overview">概要</h3>
            <p>${step.body}</p>
            <h3 id="modal-steps">手順</h3>
            <ol>
              <li>対象 namespace と操作対象を確認します。</li>
              <li>以下のコマンドを実行します。</li>
            </ol>
            ${codeBlock("bash", step.code)}
            <h3 id="modal-verify">検証</h3>
            <p>コマンドの戻り値と対象リソースの状態を確認し、問題がなければ終了打刻を行います。</p>
            <h3 id="modal-notes">注意事項</h3>
            <div class="note-box"><strong>注記</strong>本番作業では、実行前に対象 namespace と環境名を必ず確認します。</div>
          `;
        }

        return `
          <h3 id="modal-overview">概要</h3>
          <p>Developer Hub が RHBK で認証できるように、RHBK 側の情報、Developer Hub のシークレット、カスタム設定、再起動、ログイン検証を順番に確認します。</p>
          <div class="note-box"><strong>注記</strong>この手順はスクロール確認用の長い作業例です。詳細ポップアップ内で長い本文、番号付き手順、複数のコードスニペットが崩れないことを確認します。</div>

          <h3 id="modal-steps">手順</h3>
          <ol>
            <li>RHBK のレルム、クライアント ID、リダイレクト URI、クライアントシークレットを確認します。値は後続の Developer Hub 設定で使うため、作業メモに残します。</li>
            <li>Developer Hub 側で認証情報を保存する Secret を確認します。既存 Secret がある場合は更新し、ない場合は新規作成します。</li>
          </ol>
          ${codeBlock(
            "bash",
            "oc -n rhdh create secret generic rhdh-secrets \\\n  --from-literal=AUTH_OIDC_CLIENT_ID=rhdh \\\n  --from-literal=AUTH_OIDC_CLIENT_SECRET='<client-secret>' \\\n  --from-literal=AUTH_OIDC_METADATA_URL='https://keycloak.example.com/realms/rhdh' \\\n  --dry-run=client -o yaml | oc apply -f -"
          )}
          <ol start="3">
            <li>カスタム設定用 ConfigMap を編集し、OIDC プロバイダーを有効化します。インデントを崩すと YAML として読み込めないため、設定ブロック単位で確認します。</li>
          </ol>
          ${codeBlock(
            "yaml",
            "auth:\n  environment: production\n  providers:\n    oidc:\n      production:\n        metadataUrl: ${AUTH_OIDC_METADATA_URL}\n        clientId: ${AUTH_OIDC_CLIENT_ID}\n        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}\n        prompt: auto\nsignInPage: oidc"
          )}
          <ol start="4">
            <li>必要に応じてコールバック URL、トークンエンドポイント認証方法、署名アルゴリズム、スコープを追加します。環境差分がある場合はこの行を途中基準点として予定時刻を調整します。</li>
          </ol>
          ${codeBlock(
            "yaml",
            "auth:\n  providers:\n    oidc:\n      production:\n        callbackUrl: ${AUTH_OIDC_CALLBACK_URL}\n        tokenEndpointAuthMethod: ${AUTH_OIDC_TOKEN_ENDPOINT_METHOD}\n        tokenSignedResponseAlg: ${AUTH_OIDC_SIGNED_RESPONSE_ALG}\n        scope: ${AUTH_OIDC_SCOPE}"
          )}
          <ol start="5">
            <li>Developer Hub を再起動し、新しい設定を読み込ませます。Pod が再作成されるまで待機し、イベントとログにエラーが出ていないことを確認します。</li>
          </ol>
          ${codeBlock(
            "bash",
            "oc -n rhdh rollout restart deployment/rhdh\noc -n rhdh rollout status deployment/rhdh\noc -n rhdh logs deployment/rhdh --tail=120"
          )}

          <h3 id="modal-verify">検証</h3>
          <ol>
            <li>Developer Hub のログイン画面を開き、OIDC のサインイン導線が表示されることを確認します。</li>
            <li>検証用ユーザーでログインし、カタログ画面に遷移できることを確認します。</li>
            <li>ログイン失敗時は Secret、metadata URL、callback URL、RHBK 側のリダイレクト URI を順番に確認します。</li>
          </ol>
          ${codeBlock(
            "bash",
            "oc -n rhdh logs deployment/rhdh | grep -i 'oidc\\|auth\\|callback'\noc -n rhdh get secret rhdh-secrets -o jsonpath='{.data.AUTH_OIDC_METADATA_URL}' | base64 -d"
          )}

          <h3 id="modal-notes">注意事項</h3>
          <p>本番作業では、Secret の値を画面共有やログへ出さないようにします。再実行時は、既存セッションやブラウザーキャッシュの影響を避けるため、プライベートウィンドウで検証します。</p>
          <p>手順が長い場合でも、開始打刻と終了打刻はこの詳細ポップアップ下部から行い、予定時刻の修正は一覧側の日時欄から行います。</p>
        `;
      }

      function openModal(step) {
        document.getElementById("modalTitle").textContent = step.title;
        document.getElementById("modalGroup").textContent = `${step.group} / 手順 ${step.no}`;
        document.getElementById("modalDoc").innerHTML = renderDoc(step);
        modalBackdrop.classList.add("open");
      }

      plannedBtn.addEventListener("click", () => setMode("planned"));
      actualBtn.addEventListener("click", () => setMode("actual"));
      themeToggle.addEventListener("click", () => {
        const isDark = document.body.dataset.theme === "dark";
        document.body.dataset.theme = isDark ? "light" : "dark";
        themeToggle.textContent = isDark ? "ダーク" : "ライト";
      });
      document.getElementById("closeModal").addEventListener("click", () => {
        modalBackdrop.classList.remove("open");
      });
      modalBackdrop.addEventListener("click", (event) => {
        if (event.target === modalBackdrop) modalBackdrop.classList.remove("open");
      });

      render();
    </script>
  </body>
</html>
