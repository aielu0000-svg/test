name: Finalize requested improvements

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/finalize-requested-improvements.yml
      - .github/scripts/finalize_requested_improvements.py

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0
      - name: Update records and remove temporary files
        run: python .github/scripts/finalize_requested_improvements.py
      - name: Validate diff
        run: git diff --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document and finalize requested usability improvements"
          git push origin HEAD:agent/folder-explorer-p2
