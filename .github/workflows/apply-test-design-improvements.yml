name: Apply test design improvements

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/apply-test-design-improvements.yml
      - .github/scripts/apply_test_design_improvements.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_test_design_improvements.py
      - name: Validate diff
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/client/FolderExplorer.tsx web/src/client/TestDesignEditor.tsx web/src/client/ViewImageEditor.tsx web/src/client/test-design.css web/src/server/routes/scenarioEditor.ts
          git commit -m "Improve folder and test design workflows"
          git push origin HEAD:agent/folder-explorer-p2
