name: Diagnose Excel image handling

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/diagnose-excel-image.yml

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Diagnose Excel image round-trip
        working-directory: web
        run: |
          node --input-type=module <<'NODE'
          import ExcelJS from 'exceljs';
          import sharp from 'sharp';

          const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z7b8AAAAASUVORK5CYII=', 'base64');
          console.log('input_bytes', png.length);
          const converted = await sharp(png).rotate().resize({ width: 900, height: 600, fit: 'inside', withoutEnlargement: true }).png().toBuffer();
          console.log('converted_bytes', converted.length);

          for (const mode of ['range', 'position']) {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('証跡');
            sheet.addRow(['画像']);
            sheet.addRow(['埋め込み']);
            const id = workbook.addImage({
              base64: `data:image/png;base64,${converted.toString('base64')}`,
              extension: 'png',
            });
            if (mode === 'range') {
              sheet.addImage(id, 'A2:B3');
            } else {
              sheet.addImage(id, {
                tl: { col: 0, row: 1 },
                ext: { width: 320, height: 180 },
                editAs: 'oneCell',
              });
            }
            const buffer = Buffer.from(await workbook.xlsx.writeBuffer());
            const loaded = new ExcelJS.Workbook();
            await loaded.xlsx.load(buffer);
            const loadedSheet = loaded.getWorksheet('証跡');
            console.log(mode, 'written_bytes', buffer.length, 'getImages', loadedSheet?.getImages().length, 'media', loaded.model.media?.length ?? 0);
          }
          NODE
