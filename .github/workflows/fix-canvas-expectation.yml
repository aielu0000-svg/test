name: Fix canvas expectation

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/fix-canvas-expectation.yml
      - .github/scripts/fix_canvas_expectation.py

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0
      - name: Apply test fix
        run: python .github/scripts/fix_canvas_expectation.py
      - name: Validate diff
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify test code
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npx playwright test --list
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/requested-improvements.spec.ts
          git commit -m "Fix reference image editor regression expectation"
          git push origin HEAD:agent/folder-explorer-p2
