name: Repository Cleanup

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/repository-cleanup.yaml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/folder-explorer-p2
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Apply repository cleanup
        run: python .github/scripts/repository_cleanup.py apply

      - name: Verify repository references
        run: python .github/scripts/repository_cleanup.py verify

      - name: Validate shell and YAML syntax
        run: |
          bash -n web/ops/*.sh web/scripts/ci/*.sh web/scripts/openshift/*.sh
          python - <<'PY'
          import pathlib
          import yaml
          for path in [pathlib.Path('compose.yaml'), *pathlib.Path('web').glob('*.yaml'), *pathlib.Path('.github/workflows').glob('*.yaml')]:
              list(yaml.safe_load_all(path.read_text(encoding='utf-8')))
          PY

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Local static verification
        working-directory: web
        run: |
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - name: Commit repository cleanup
        id: cleanup_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify repository structure"
          git push origin "HEAD:${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch full Web CI
        run: gh workflow run web-ci.yaml --ref "$BRANCH"

      - name: Resolve dispatched Web CI run
        id: web_ci
        env:
          CLEANUP_SHA: ${{ steps.cleanup_commit.outputs.sha }}
        run: |
          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow web-ci.yaml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$CLEANUP_SHA\") | .databaseId" | head -n 1)"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for full Web CI
        run: gh run watch "${{ steps.web_ci.outputs.run_id }}" --exit-status

      - name: Resolve verification artifact
        id: artifact
        run: |
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.web_ci.outputs.run_id }}/artifacts" --jq '.artifacts[0]')"
          artifact_name="$(jq -r '.name' <<<"$artifact_json")"
          artifact_id="$(jq -r '.id' <<<"$artifact_json")"
          test "$artifact_name" != "null"
          test "$artifact_id" != "null"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Finalize maintenance records
        run: >-
          python .github/scripts/repository_cleanup.py finalize
          --run-id "${{ steps.web_ci.outputs.run_id }}"
          --artifact-name "${{ steps.artifact.outputs.name }}"
          --artifact-id "${{ steps.artifact.outputs.id }}"

      - name: Commit verification records
        run: |
          git add docs web/README.md
          git commit -m "Record repository cleanup verification"
          git push origin "HEAD:${BRANCH}"
