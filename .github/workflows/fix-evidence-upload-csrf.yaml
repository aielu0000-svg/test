name: Fix Evidence Upload CSRF

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/fix-evidence-upload-csrf.yaml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
      - name: Patch upload request and help text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/src/client/OperationsWorkspaceV2.tsx')
          source = path.read_text()
          marker = '      request.open("POST", `/api/evidence?projectId=${encodeURIComponent(projectId)}&testRunId=${encodeURIComponent(runId)}&runCaseSnapshotId=${encodeURIComponent(caseId)}`);\n      request.withCredentials = true;\n'
          replacement = '      request.open("POST", `/api/evidence?projectId=${encodeURIComponent(projectId)}&testRunId=${encodeURIComponent(runId)}&runCaseSnapshotId=${encodeURIComponent(caseId)}`);\n      request.setRequestHeader("X-The-Test-Request", "1");\n      request.withCredentials = true;\n'
          if source.count(marker) != 1:
              raise SystemExit('upload request marker mismatch')
          source = source.replace(marker, replacement, 1)
          old = '証跡アップロードはmultipartストリームで処理し、アプリ固有の1ファイル上限は設けていません。配備先のプロキシ、ストレージ容量、ブラウザ、タイムアウトにより制限される場合があります。'
          new = '証跡アップロードはmultipartストリームで処理し、1要求につき1ファイル、最大100 MiBまでです。配備先のプロキシ、ストレージ容量、ブラウザ、タイムアウトにより、さらに小さい上限が適用される場合があります。'
          if source.count(old) != 1:
              raise SystemExit('help text marker mismatch')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/src/client/OperationsWorkspaceV2.tsx
          git commit -m "Send CSRF header with evidence uploads"
          git push origin HEAD:agent/folder-explorer-p2
