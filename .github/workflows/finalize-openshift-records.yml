name: Finalize OpenShift records

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/finalize-openshift-records.yml
      - .github/scripts/finalize_openshift_records.py

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0

      - name: Update records
        run: python .github/scripts/finalize_openshift_records.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ISSUE_LEDGER.md docs/TASK_LOG.md docs/OPEN_ISSUES.md
          git diff --cached --check
          git commit -m "Document verified OpenShift deployment support"
          git push origin HEAD:agent/folder-explorer-p2
