name: Implement run Markdown export

on:
  push:
    branches: [agent/folder-explorer-p2]
    paths:
      - ".github/workflows/implement-run-markdown.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Add run Markdown builder
        shell: bash
        run: |
          cat > web/src/server/runMarkdown.ts <<'EOF'
          import { readFile } from "node:fs/promises";
          import sharp from "sharp";
          import type { Database } from "./db.js";
          import { notFound } from "./errors.js";

          type Row = Record<string, unknown>;

          export interface RunMarkdownInput {
            run: Row;
            scenarios: Row[];
            cases: Row[];
            steps: Row[];
            evidence: Row[];
            exportedAt?: string;
          }

          const resultLabels: Record<string, string> = {
            pass: "合格",
            fail: "不合格",
            blocked: "ブロック",
            skip: "スキップ",
            not_run: "未実行",
          };

          const runStatusLabels: Record<string, string> = {
            draft: "下書き",
            in_progress: "実行中",
            completed: "完了",
          };

          function raw(value: unknown): string {
            return value === null || value === undefined ? "" : String(value);
          }

          function escaped(value: unknown): string {
            return raw(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          }

          function heading(value: unknown, fallback = "名称未設定"): string {
            return escaped(value).replace(/\r?\n/g, " ").trim() || fallback;
          }

          function paragraph(value: unknown): string {
            return escaped(value).trim() || "—";
          }

          function cell(value: unknown): string {
            return escaped(value).replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>").trim() || "—";
          }

          function linkLabel(value: unknown): string {
            return heading(value).replace(/\[/g, "（").replace(/\]/g, "）");
          }

          function htmlAttribute(value: unknown): string {
            return raw(value)
              .replace(/&/g, "&amp;")
              .replace(/"/g, "&quot;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          function safeFilename(value: unknown): string {
            return raw(value).replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").trim().slice(0, 100) || "the-test-run";
          }

          function formatDate(value: unknown): string {
            const text = raw(value).trim();
            if (!text) return "—";
            const date = new Date(text);
            return Number.isNaN(date.getTime()) ? escaped(text) : date.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
          }

          export function renderRunMarkdown(input: RunMarkdownInput): string {
            const activeScenarios = input.scenarios.filter((item) => !item.excluded_at);
            const activeCases = input.cases.filter((item) => !item.excluded_at).map((row, index) => ({
              row,
              anchor: `case-${String(index + 1).padStart(3, "0")}`,
              number: index + 1,
            }));
            const stepsByCase = new Map<string, Row[]>();
            for (const step of input.steps) {
              const key = raw(step.run_case_snapshot_id);
              stepsByCase.set(key, [...(stepsByCase.get(key) ?? []), step]);
            }
            const evidenceByCase = new Map<string, Row[]>();
            for (const item of input.evidence) {
              const key = raw(item.run_case_snapshot_id);
              evidenceByCase.set(key, [...(evidenceByCase.get(key) ?? []), item]);
            }

            const scenarioGroups = activeScenarios.map((scenario, index) => ({
              id: raw(scenario.id),
              title: heading(scenario.title, `シナリオ ${index + 1}`),
              anchor: `scenario-${String(index + 1).padStart(3, "0")}`,
            }));
            const knownScenarioIds = new Set(scenarioGroups.map((item) => item.id));
            const orphanScenarioIds = [...new Set(activeCases.map(({ row }) => raw(row.run_scenario_snapshot_id)).filter((id) => id && !knownScenarioIds.has(id)))];
            orphanScenarioIds.forEach((id, index) => scenarioGroups.push({
              id,
              title: heading(activeCases.find(({ row }) => raw(row.run_scenario_snapshot_id) === id)?.row.scenario_title, `シナリオ ${activeScenarios.length + index + 1}`),
              anchor: `scenario-${String(activeScenarios.length + index + 1).padStart(3, "0")}`,
            }));
            if (activeCases.some(({ row }) => !row.run_scenario_snapshot_id)) {
              scenarioGroups.push({ id: "", title: "単独確認項目", anchor: "scenario-standalone" });
            }

            const resultOrder = ["pass", "fail", "blocked", "skip", "not_run"];
            const counts = new Map(resultOrder.map((status) => [status, 0]));
            activeCases.forEach(({ row }) => counts.set(raw(row.status), (counts.get(raw(row.status)) ?? 0) + 1));

            const lines: string[] = [
              `# ${heading(input.run.name, "テスト実行結果")}`,
              "",
              "<a id=\"summary\"></a>",
              "## 実行概要",
              "",
              "| 項目 | 内容 |",
              "|---|---|",
              `| プロジェクト | ${cell(input.run.project_name)} |`,
              `| 実行名 | ${cell(input.run.name)} |`,
              `| 状態 | ${cell(runStatusLabels[raw(input.run.status)] ?? input.run.status)} |`,
              `| 環境 | ${cell(input.run.environment_name)} |`,
              `| ビルド | ${cell(input.run.build_name)} |`,
              `| 担当者 | ${cell(input.run.assignee_display_name || input.run.assignee_username || "未割当")} |`,
              `| 開始日時 | ${formatDate(input.run.started_at)} |`,
              `| 完了日時 | ${formatDate(input.run.completed_at)} |`,
              `| 出力日時 | ${formatDate(input.exportedAt ?? new Date().toISOString())} |`,
              "",
              "<a id=\"toc\"></a>",
              "## 目次",
              "",
              "- [実行概要](#summary)",
              "- [結果概要](#result-summary)",
            ];

            for (const status of resultOrder) {
              const count = counts.get(status) ?? 0;
              lines.push(`  - [${resultLabels[status]}（${count}件）](#result-${status})`);
            }
            lines.push("- [シナリオ別結果](#scenario-results)");
            for (const scenario of scenarioGroups) {
              const cases = activeCases.filter(({ row }) => raw(row.run_scenario_snapshot_id) === scenario.id);
              lines.push(`  - [${linkLabel(scenario.title)}](#${scenario.anchor})`);
              for (const item of cases) {
                lines.push(`    - [${item.number}. ${linkLabel(item.row.title)} — ${resultLabels[raw(item.row.status)] ?? heading(item.row.status)}](#${item.anchor})`);
              }
            }

            lines.push("", "<a id=\"result-summary\"></a>", "## 結果概要", "", "| 結果 | 件数 |", "|---|---:|");
            for (const status of resultOrder) lines.push(`| [${resultLabels[status]}](#result-${status}) | ${counts.get(status) ?? 0} |`);

            for (const status of resultOrder) {
              const items = activeCases.filter(({ row }) => raw(row.status) === status);
              lines.push("", `<a id=\"result-${status}\"></a>`, `### ${resultLabels[status]}（${items.length}件）`, "");
              if (!items.length) {
                lines.push("該当する確認項目はありません。", "");
              } else {
                for (const item of items) {
                  const scenarioTitle = heading(item.row.scenario_title, item.row.run_scenario_snapshot_id ? "シナリオ" : "単独確認項目");
                  lines.push(`- [${linkLabel(scenarioTitle)} / ${linkLabel(item.row.title)}](#${item.anchor})`);
                }
                lines.push("");
              }
              lines.push("[目次へ戻る](#toc)");
            }

            lines.push("", "<a id=\"scenario-results\"></a>", "## シナリオ別結果", "");
            for (const scenario of scenarioGroups) {
              const cases = activeCases.filter(({ row }) => raw(row.run_scenario_snapshot_id) === scenario.id);
              lines.push(`<a id=\"${scenario.anchor}\"></a>`, `## ${scenario.title}`, "");
              if (!cases.length) {
                lines.push("対象となる確認項目はありません。", "", "[目次へ戻る](#toc)", "");
                continue;
              }
              lines.push("| No. | 確認項目 | 結果 | 担当者 |", "|---:|---|---|---|");
              for (const item of cases) {
                lines.push(`| ${item.number} | [${linkLabel(item.row.title)}](#${item.anchor}) | ${cell(resultLabels[raw(item.row.status)] ?? item.row.status)} | ${cell(item.row.assignee_display_name || item.row.assignee_username || "未割当")} |`);
              }
              lines.push("");

              for (const item of cases) {
                const row = item.row;
                const steps = stepsByCase.get(raw(row.id)) ?? [];
                const images = (evidenceByCase.get(raw(row.id)) ?? []).filter((evidence) => raw(evidence.image_data_uri).startsWith("data:image/"));
                lines.push(
                  `<a id=\"${item.anchor}\"></a>`,
                  `### ${item.number}. ${heading(row.title, "確認項目")}`,
                  "",
                  `**結果：${heading(resultLabels[raw(row.status)] ?? row.status, "未実行")}**`,
                  "",
                  "| 項目 | 内容 |",
                  "|---|---|",
                  `| 優先度 | ${cell(row.priority)} |`,
                  `| 担当者 | ${cell(row.assignee_display_name || row.assignee_username || "未割当")} |`,
                  `| 実行日時 | ${formatDate(row.executed_at)} |`,
                  `| 見る場所 | ${cell(row.view_location)} |`,
                  "",
                  "#### 目的",
                  "",
                  paragraph(row.objective),
                  "",
                  "#### 前提条件",
                  "",
                  paragraph(row.preconditions),
                  "",
                  "#### 操作と期待結果",
                  "",
                  "| No. | 操作 | 期待結果 |",
                  "|---:|---|---|",
                );
                if (steps.length) {
                  for (const step of steps) lines.push(`| ${cell(step.step_no)} | ${cell(step.action_text)} | ${cell(step.expected_result)} |`);
                } else {
                  lines.push("| — | — | — |");
                }
                lines.push(
                  "",
                  "#### 実績結果",
                  "",
                  paragraph(row.actual_result),
                  "",
                  "#### 備考",
                  "",
                  paragraph(row.notes),
                  "",
                  "#### 証跡",
                  "",
                );
                if (!images.length) {
                  lines.push("画像証跡はありません。", "");
                } else {
                  images.forEach((evidence, imageIndex) => {
                    const description = raw(evidence.description).trim() || `証跡画像 ${imageIndex + 1}`;
                    lines.push(
                      `##### 証跡 ${imageIndex + 1}`,
                      "",
                      paragraph(description),
                      "",
                      `<img src=\"${raw(evidence.image_data_uri)}\" alt=\"${htmlAttribute(description)}\" style=\"max-width:100%;height:auto;\">`,
                      "",
                    );
                  });
                }
                lines.push(`[${linkLabel(scenario.title)}へ戻る](#${scenario.anchor}) · [目次へ戻る](#toc)`, "", "---", "");
              }
            }
            return `\uFEFF${lines.join("\n").trimEnd()}\n`;
          }

          export async function buildRunMarkdown(db: Database, projectId: string, runId: string): Promise<{ filename: string; markdown: string }> {
            const runRows = await db.query<Row>(
              `SELECT r.*, p.name AS project_name, u.username AS assignee_username, u.display_name AS assignee_display_name
                 FROM test_runs r
                 JOIN projects p ON p.id = r.project_id
                 LEFT JOIN users u ON u.id = r.assignee_id
                WHERE r.id = ? AND r.project_id = ? AND r.deleted_at IS NULL LIMIT 1`,
              [runId, projectId],
            );
            const run = runRows[0];
            if (!run) throw notFound();
            const [scenarios, cases, steps, evidenceRows] = await Promise.all([
              db.query<Row>("SELECT id, title, status, position, excluded_at, exclusion_reason FROM run_scenario_snapshots WHERE test_run_id = ? ORDER BY position, created_at", [runId]),
              db.query<Row>(
                `SELECT c.*, s.title AS scenario_title, u.username AS assignee_username, u.display_name AS assignee_display_name
                   FROM run_case_snapshots c
                   LEFT JOIN run_scenario_snapshots s ON s.id = c.run_scenario_snapshot_id
                   LEFT JOIN users u ON u.id = c.assignee_id
                  WHERE c.test_run_id = ? ORDER BY COALESCE(s.position, 999999), c.position, c.created_at`,
                [runId],
              ),
              db.query<Row>("SELECT run_case_snapshot_id, step_no, action_text, expected_result FROM run_step_snapshots WHERE run_case_snapshot_id IN (SELECT id FROM run_case_snapshots WHERE test_run_id = ?) ORDER BY run_case_snapshot_id, step_no", [runId]),
              db.query<Row>(
                `SELECT e.id, e.run_case_snapshot_id, e.description, v.content_type, v.stored_path
                   FROM evidence_files e
                   JOIN evidence_versions v ON v.evidence_file_id = e.id AND v.version_no = e.current_version
                   JOIN run_case_snapshots c ON c.id = e.run_case_snapshot_id
                  WHERE e.project_id = ? AND c.test_run_id = ? AND e.deleted_at IS NULL
                  ORDER BY c.position, e.updated_at`,
                [projectId, runId],
              ),
            ]);
            const evidence: Row[] = [];
            for (const item of evidenceRows) {
              if (!raw(item.content_type).toLowerCase().startsWith("image/")) continue;
              let imageDataUri = "";
              try {
                const source = await readFile(raw(item.stored_path));
                const image = await sharp(source)
                  .rotate()
                  .resize({ width: 1200, height: 900, fit: "inside", withoutEnlargement: true })
                  .png({ compressionLevel: 9, adaptiveFiltering: true })
                  .toBuffer();
                imageDataUri = `data:image/png;base64,${image.toString("base64")}`;
              } catch {
                imageDataUri = "";
              }
              evidence.push({ ...item, image_data_uri: imageDataUri });
            }
            const markdown = renderRunMarkdown({ run, scenarios, cases, steps, evidence, exportedAt: new Date().toISOString() });
            return { filename: `${safeFilename(run.name)}-実行結果.md`, markdown };
          }
          EOF

          cat > web/src/server/runMarkdown.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { renderRunMarkdown } from "./runMarkdown.js";

          describe("renderRunMarkdown", () => {
            it("creates one navigable document and omits test data and evidence metadata", () => {
              const markdown = renderRunMarkdown({
                run: { name: "受入試験", project_name: "顧客管理", status: "completed", assignee_display_name: "山田" },
                scenarios: [
                  { id: "s1", title: "正常系", excluded_at: null },
                  { id: "s2", title: "異常系", excluded_at: null },
                ],
                cases: [
                  { id: "c1", run_scenario_snapshot_id: "s1", scenario_title: "正常系", title: "ログイン成功", status: "pass", priority: "high", actual_result: "表示された", notes: "", data: "secret-value", excluded_at: null },
                  { id: "c2", run_scenario_snapshot_id: "s2", scenario_title: "異常系", title: "ロック", status: "fail", priority: "high", actual_result: "ロックされない", notes: "要修正", excluded_at: null },
                ],
                steps: [
                  { run_case_snapshot_id: "c1", step_no: 1, action_text: "ログインする", expected_result: "ホームを表示" },
                ],
                evidence: [
                  { run_case_snapshot_id: "c1", description: "ログイン後画面", image_data_uri: "data:image/png;base64,AAAA", original_filename: "internal.png", sha256: "secret-hash" },
                ],
                exportedAt: "2026-08-06T00:00:00.000Z",
              });

              expect(markdown).toContain("[合格（1件）](#result-pass)");
              expect(markdown).toContain("[不合格（1件）](#result-fail)");
              expect(markdown).toContain("[正常系](#scenario-001)");
              expect(markdown).toContain("<a id=\"case-001\"></a>");
              expect(markdown).toContain("data:image/png;base64,AAAA");
              expect(markdown).toContain("ログイン後画面");
              expect(markdown).not.toContain("secret-value");
              expect(markdown).not.toContain("internal.png");
              expect(markdown).not.toContain("secret-hash");
            });
          });
          EOF

      - name: Update API route, UI, OpenAPI and ledgers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          exports = Path("web/src/server/routes/exports.ts")
          text = exports.read_text(encoding="utf-8")
          import_marker = 'import { normalizeDatabaseRecord } from "../jsonNormalization.js";\n'
          if 'from "../runMarkdown.js"' not in text:
              text = text.replace(import_marker, import_marker + 'import { buildRunMarkdown } from "../runMarkdown.js";\n')
          route_marker = '''  app.post("/api/imports/json/preview", async (request) => {'''
          route = '''  app.get("/api/test-runs/:id/export.md", async (request, reply) => {
            const actor = await requireUser(request, db, config);
            const projectId = projectIdFrom(request);
            await requireProjectRead(db, actor, projectId);
            const runId = routeParam(request);
            const exported = await buildRunMarkdown(db, projectId, runId);
            await writeAudit(db, request, actor, { action: "test_run_markdown_exported", entityType: "test_run", entityId: runId, projectId });
            const disposition = `attachment; filename="the-test-run.md"; filename*=UTF-8''${encodeURIComponent(exported.filename)}`;
            return reply.header("Content-Type", "text/markdown; charset=utf-8")
              .header("Content-Disposition", disposition).send(exported.markdown);
          });

'''
          if '/api/test-runs/:id/export.md' not in text:
              text = text.replace(route_marker, route + route_marker)
          exports.write_text(text, encoding="utf-8")

          openapi = Path("web/openapi.yaml")
          text = openapi.read_text(encoding="utf-8")
          marker = '''    delete:
              tags: [runs]
              responses: { '200': { description: Soft deleted } }
            /api/test-runs/{id}/revisions:
'''.replace('            ', '  ')
          addition = '''    delete:
              tags: [runs]
              responses: { '200': { description: Soft deleted } }
            /api/test-runs/{id}/export.xlsx:
              get:
                tags: [exports]
                description: 実行概要、結果、テストデータ、証跡をExcelで出力する。
                parameters:
                  - { $ref: '#/components/parameters/id' }
                  - { $ref: '#/components/parameters/projectId' }
                responses:
                  '200':
                    description: Excel workbook
                    content:
                      application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
                        schema: { type: string, format: binary }
            /api/test-runs/{id}/export.md:
              get:
                tags: [exports]
                description: 単一Markdownへ実行概要、結果別目次、シナリオ別結果、画像証跡と説明を出力する。テストデータと証跡メタデータは含めない。
                parameters:
                  - { $ref: '#/components/parameters/id' }
                  - { $ref: '#/components/parameters/projectId' }
                responses:
                  '200':
                    description: 内部リンクとData URI画像を含む単一Markdown文書
                    content:
                      text/markdown:
                        schema: { type: string }
            /api/test-runs/{id}/revisions:
'''.replace('            ', '  ')
          if '/api/test-runs/{id}/export.md:' not in text:
              if marker not in text:
                  raise SystemExit('OpenAPI insertion marker not found')
              text = text.replace(marker, addition)
          openapi.write_text(text, encoding="utf-8")
          PY

          cat > web/src/client/ExportPanel.tsx <<'EOF'
          import { useEffect, useState } from "react";
          import "./operations.css";
          import { request } from "./api.js";

          interface ExportRunOption { id: string; name: string; status: "draft" | "in_progress" | "completed"; updatedAt: string }
          type ExportFormat = "json" | "xlsx" | "csv" | "md";

          export function ExportPanel({ projectId, canEdit }: { projectId: string; canEdit: boolean }) {
            const [target, setTarget] = useState<"project" | "design" | "run">("project");
            const [format, setFormat] = useState<ExportFormat>("json");
            const [runs, setRuns] = useState<ExportRunOption[]>([]);
            const [runId, setRunId] = useState("");
            const [content, setContent] = useState("");
            const [previewId, setPreviewId] = useState("");
            const [message, setMessage] = useState("");
            useEffect(() => {
              void request<{ runs: ExportRunOption[] }>(`/api/test-runs?projectId=${encodeURIComponent(projectId)}&limit=100`).then((result) => {
                setRuns(result.runs);
                setRunId((current) => current && result.runs.some((item) => item.id === current) ? current : result.runs[0]?.id ?? "");
              }).catch((cause) => setMessage(cause instanceof Error ? cause.message : "テスト実行を読み込めませんでした。"));
            }, [projectId]);
            useEffect(() => {
              if (target === "project" && !["json", "xlsx"].includes(format)) setFormat("json");
              if (target === "design" && !["xlsx", "csv", "md"].includes(format)) setFormat("xlsx");
              if (target === "run" && !["xlsx", "md"].includes(format)) setFormat("xlsx");
            }, [target, format]);
            const projectLinks: Record<string, string> = {
              json: `/api/projects/${projectId}/export`, xlsx: `/api/projects/${projectId}/export.xlsx`,
              csv: `/api/projects/${projectId}/export.csv`, md: `/api/projects/${projectId}/export.md`,
            };
            const runLinks: Record<"xlsx" | "md", string> = runId ? {
              xlsx: `/api/test-runs/${runId}/export.xlsx?projectId=${encodeURIComponent(projectId)}`,
              md: `/api/test-runs/${runId}/export.md?projectId=${encodeURIComponent(projectId)}`,
            } : { xlsx: "", md: "" };
            const downloadHref = target === "run" ? runLinks[format === "md" ? "md" : "xlsx"] : projectLinks[format];
            const selectedRun = runs.find((item) => item.id === runId);
            async function preview() {
              try {
                const payload = JSON.parse(content);
                const result = await request<{ previewId: string; counts: Record<string, number>; warnings: string[] }>("/api/imports/json/preview", { method: "POST", body: JSON.stringify({ projectId, payload }) });
                setPreviewId(result.previewId); setMessage(`検証済み: ${JSON.stringify(result.counts)}`);
              } catch (cause) { setMessage(cause instanceof Error ? cause.message : "JSON検証に失敗しました。"); }
            }
            async function confirm() {
              try { const result = await request<{ imported: number }>(`/api/imports/json/${previewId}/confirm`, { method: "POST" }); setMessage(`${result.imported}件のID対応を作成して取り込みました。`); setPreviewId(""); }
              catch (cause) { setMessage(cause instanceof Error ? cause.message : "取込に失敗しました。"); }
            }
            return <div className="workspace-grid export-workspace"><section className="panel export-panel"><div className="section-heading"><div><p className="eyebrow">EXPORT</p><h2>エクスポート</h2><p className="muted">出力したい内容を選択してください。</p></div></div>
              <div className="export-targets" role="radiogroup" aria-label="エクスポート対象"><label className={target === "project" ? "selected" : ""}><input type="radio" name="export-target" checked={target === "project"} onChange={() => setTarget("project")} /><strong>プロジェクト全体</strong><span>移行・保管向け。定義、実行、データ、証跡manifestを含みます。</span></label><label className={target === "design" ? "selected" : ""}><input type="radio" name="export-target" checked={target === "design"} onChange={() => setTarget("design")} /><strong>テスト設計</strong><span>確認項目と操作手順を共有・確認するための出力です。</span></label><label className={target === "run" ? "selected" : ""}><input type="radio" name="export-target" checked={target === "run"} onChange={() => setTarget("run")} /><strong>テスト実行</strong><span>Excelまたは客先確認向けの単一Markdownで出力します。</span></label></div>
              {target === "run" ? <div className="export-options"><label>テスト実行<select value={runId} onChange={(event) => setRunId(event.target.value)}><option value="">選択してください</option>{runs.map((item) => <option key={item.id} value={item.id}>{item.name}（{item.status === "completed" ? "完了" : item.status === "in_progress" ? "実行中" : "下書き"}）</option>)}</select></label><label>形式<select value={format === "md" ? "md" : "xlsx"} onChange={(event) => setFormat(event.target.value as ExportFormat)}><option value="xlsx">Excel</option><option value="md">Markdown（画像埋め込み・単一ファイル）</option></select></label><div className="export-summary"><strong>{selectedRun?.name || "テスト実行を選択してください"}</strong><span>{format === "md" ? "目次／結果別リンク／シナリオ別結果／証跡画像と説明。テストデータと技術情報は含みません。" : "実行概要／実行結果／テストデータ／証跡を複数シートへ出力します。"}</span></div></div> : <div className="export-options"><label>形式<select value={format} onChange={(event) => setFormat(event.target.value as ExportFormat)}>{target === "project" && <><option value="json">正式JSON</option><option value="xlsx">Excel</option></>}{target === "design" && <><option value="xlsx">Excel</option><option value="csv">CSV</option><option value="md">Markdown</option></>}</select></label><div className="export-summary"><strong>{target === "project" ? "プロジェクト全体" : "テスト設計"}</strong><span>{format === "json" ? "完全移行用の正式形式" : format === "xlsx" ? "複数シートのExcel" : format === "csv" ? "確認項目中心のCSV" : "確認項目と手順のMarkdown"}</span></div></div>}
              {downloadHref ? <a className="link-button primary export-download" href={downloadHref} download>選択した内容をダウンロード</a> : <button className="primary export-download" disabled>テスト実行を選択してください</button>}
            </section><section className="panel"><h2>正式JSONインポート</h2>{canEdit ? <><textarea className="json-import" placeholder="schema_version付きJSONを貼り付け" value={content} onChange={(event) => { setContent(event.target.value); setPreviewId(""); }} /><div className="button-row"><button onClick={() => void preview()}>プレビュー検証</button>{previewId && <button className="primary" onClick={() => void confirm()}>確定</button>}</div></> : <p className="muted">取込には編集権限が必要です。</p>}{message && <p>{message}</p>}</section></div>;
          }
          EOF

          cat >> docs/TASK_LOG.md <<'EOF'

          ## 2026-08-06 テスト実行Markdownエクスポート

          - 要求: テスト実行を単一Markdownで保存・客先提示できるようにする。
          - 実施: 結果別・シナリオ別・確認項目別の固定内部リンクを持つ目次を追加した。
          - 実施: 証跡画像を縮小PNGのData URIとして単一Markdown内へ埋め込んだ。
          - 実施: Markdownからテストデータ、ファイル名、MIME type、サイズ、SHA-256、内部IDを除外した。
          - 実施: Export UI、OpenAPI、監査イベント、単体テストを更新した。
          - UI: テスト設計UI本体は変更せず、HTMLモック評価後に実装する。
          EOF

          cat >> docs/ISSUE_LEDGER.md <<'EOF'

          ## ISSUE-20260806-006 テスト実行Markdown出力

          - Status: Implemented
          - Request: 単一Markdown、内部目次、画像と説明のみの証跡、客先提示を優先した可読性。
          - Resolution: `/api/test-runs/{id}/export.md`を追加し、結果区分・シナリオ・確認項目へ固定アンカーで移動可能にした。画像はData URI埋め込みとし、テストデータと証跡メタデータは出力しない。
          - Verification: Unit test、TypeCheck、Production Build、Web CIで確認する。
          EOF

      - name: Verify implementation
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/implement-run-markdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/server/runMarkdown.ts web/src/server/runMarkdown.test.ts web/src/server/routes/exports.ts web/src/client/ExportPanel.tsx web/openapi.yaml docs/TASK_LOG.md docs/ISSUE_LEDGER.md .github/workflows/implement-run-markdown.yml
          git commit -m "Add navigable run Markdown export"
          git push origin HEAD:agent/folder-explorer-p2
