name: Implement run Markdown export

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - ".github/workflows/implement-run-markdown.yml"
      - "web/scripts/apply-run-markdown-route.mjs"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply route and documentation changes
        run: node web/scripts/apply-run-markdown-route.mjs

      - name: Verify implementation
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

      - name: Commit implementation and remove temporary files
        run: |
          rm .github/workflows/implement-run-markdown.yml
          rm web/scripts/apply-run-markdown-route.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add navigable run Markdown export"
          git push origin HEAD:agent/folder-explorer-p2
