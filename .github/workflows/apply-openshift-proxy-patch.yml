name: Apply OpenShift proxy patch

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/apply-openshift-proxy-patch.yml
      - .github/scripts/apply_openshift_proxy_patch.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0
      - run: python .github/scripts/apply_openshift_proxy_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/server/app.ts
          git diff --cached --check
          git commit -m "Trust OpenShift router proxy headers"
          git push origin HEAD:agent/folder-explorer-p2
