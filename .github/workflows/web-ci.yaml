name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "compose.yaml"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/web-ci.yaml"
  pull_request:
    paths:
      - "web/**"
      - "compose.yaml"
      - ".env.example"
      - ".dockerignore"
      - ".github/workflows/web-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: the_test_ci
          MARIADB_USER: the_test
          MARIADB_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        shell: bash
        working-directory: web

    env:
      CI: "true"
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: "3000"
      COOKIE_SECURE: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: the_test_ci
      DB_USER: the_test
      DB_PASSWORD: ci-db-password
      DB_ROOT_HOST: 127.0.0.1
      DB_ROOT_PORT: "3306"
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ci-root-password
      MARIADB_ROOT_PASSWORD: ci-root-password
      INITIAL_ADMIN_USERNAME: ci-e2e-admin
      INITIAL_ADMIN_PASSWORD: ci-e2e-password
      E2E_USERNAME: ci-e2e-admin
      E2E_PASSWORD: ci-e2e-password
      E2E_BASE_URL: http://127.0.0.1:3000
      EVIDENCE_STORAGE_PATH: ${{ github.workspace }}/web/.ci/evidence
      VIEW_IMAGE_PENDING_TTL_SECONDS: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f ../compose.yaml config

      - name: Validate OpenShift Kustomize output
        run: |
          mkdir -p .ci/artifacts
          kubectl kustomize . > .ci/artifacts/openshift-rendered.yaml
          grep -q 'kind: Route' .ci/artifacts/openshift-rendered.yaml
          grep -q 'kind: StatefulSet' .ci/artifacts/openshift-rendered.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate password repair script
        run: node --check scripts/configure-local-mariadb-password.mjs

      - name: Validate OpenShift deployment script
        run: bash -n scripts/openshift/deploy.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare artifact directories
        run: |
          mkdir -p .ci/evidence .ci/artifacts
          rm -rf test-results playwright-report

      - name: TypeCheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: MariaDB integration tests
        env:
          DB_INTEGRATION_TEST: "1"
        run: >-
          npm test --
          src/server/mariaDb.integration.test.ts
          src/server/migrationCollation.integration.test.ts

      - name: Backup, restore, and retention integration
        run: |
          set -euo pipefail
          sh -n ops/backup.sh ops/restore.sh ops/operations-worker.sh ops/purge-v2.sh
          rm -rf .ci/backup-evidence .ci/backups
          mkdir -p .ci/backup-evidence .ci/backups
          printf 'backup-evidence\n' > .ci/backup-evidence/probe.txt
          export BACKUP_STORAGE_PATH="$PWD/.ci/backups"
          export BACKUP_EVIDENCE_PATH="$PWD/.ci/backup-evidence"
          export OPERATIONS_DIR="$PWD/ops"
          export APP_VERSION="ci-${GITHUB_SHA}"
          ops/backup.sh >/dev/null
          ops/backup.sh >/dev/null
          ops/backup.sh >/dev/null
          test "$(find .ci/backups -mindepth 1 -maxdepth 1 -type d ! -name '.*' | wc -l)" -eq 2
          target_backup="$(find .ci/backups -mindepth 1 -maxdepth 1 -type d ! -name '.*' -printf '%f\n' | sort | head -n 1)"
          test -n "$target_backup"
          (cd ".ci/backups/$target_backup" && sha256sum -c SHA256SUMS)
          grep -q '"status": "succeeded"' ".ci/backups/$target_backup/manifest.json"
          printf 'changed-after-backup\n' > .ci/backup-evidence/probe.txt
          mariadb --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" "$DB_NAME" \
            -e "INSERT INTO system_state (state_key, state_value) VALUES ('restore_probe','present') ON DUPLICATE KEY UPDATE state_value='present'"
          ops/restore.sh "$target_backup" >/dev/null
          grep -qx 'backup-evidence' .ci/backup-evidence/probe.txt
          test "$(find .ci/backups -mindepth 1 -maxdepth 1 -type d ! -name '.*' | wc -l)" -eq 2
          test "$(mariadb --batch --skip-column-names --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) FROM backup_catalog")" -eq 2
          test "$(mariadb --batch --skip-column-names --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" "$DB_NAME" -e "SELECT COUNT(*) FROM system_state WHERE state_key='restore_probe'")" -eq 0
          mariadb --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" --password="$DB_PASSWORD" "$DB_NAME" < ops/purge-v2.sql

      - name: Build
        run: npm run build

      - name: Build OpenShift-compatible container
        run: docker build -f Dockerfile -t the-test-web:ci ..

      - name: Run container as arbitrary OpenShift UID
        run: |
          docker run -d --name the-test-web-container \
            --network host \
            --user 1000780000:0 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g,uid=1000780000,gid=0,mode=0770 \
            --tmpfs /var/lib/the-test/evidence:rw,noexec,nosuid,size=1g,uid=1000780000,gid=0,mode=0770 \
            -e NODE_ENV=production \
            -e HOST=127.0.0.1 \
            -e PORT=3100 \
            -e COOKIE_SECURE=false \
            -e TRUST_PROXY=true \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_NAME=the_test_ci \
            -e DB_USER=the_test \
            -e DB_PASSWORD=ci-db-password \
            -e INITIAL_ADMIN_USERNAME=ci-e2e-admin \
            -e INITIAL_ADMIN_PASSWORD=ci-e2e-password \
            the-test-web:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/readyz >/dev/null; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' the-test-web-container 2>/dev/null | grep -q true; then
              docker logs the-test-web-container
              exit 1
            fi
            sleep 1
          done
          docker logs the-test-web-container
          exit 1

      - name: Stop arbitrary-UID container
        if: always()
        run: docker rm -f the-test-web-container 2>/dev/null || true

      - name: Start web application
        run: |
          nohup npm run dev > .ci/artifacts/server.log 2>&1 &
          echo $! > .ci/server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .ci/server.pid)" 2>/dev/null; then
              cat .ci/artifacts/server.log
              exit 1
            fi
            sleep 1
          done
          cat .ci/artifacts/server.log
          exit 1

      - name: Complete initial password setup
        run: bash scripts/ci/bootstrap-e2e-user.sh

      - name: Chromium E2E
        run: npx playwright test --workers=1 --forbid-only --reporter=line,html

      - name: Export DB and audit evidence
        if: always()
        run: |
          set +e
          mariadb-dump \
            --host=127.0.0.1 --port=3306 \
            --user=the_test --password=ci-db-password \
            --single-transaction --skip-comments \
            the_test_ci > .ci/artifacts/the_test_ci.sql

          mariadb \
            --host=127.0.0.1 --port=3306 \
            --user=the_test --password=ci-db-password \
            --batch --raw --database=the_test_ci \
            --execute="SELECT occurred_at, username, project_id, action, entity_type, entity_id, request_id, success, error_code FROM audit_logs ORDER BY occurred_at" \
            > .ci/artifacts/audit_logs.tsv

          mariadb \
            --host=127.0.0.1 --port=3306 \
            --user=the_test --password=ci-db-password \
            --batch --raw --database=the_test_ci \
            --execute="SELECT 'users' AS table_name, COUNT(*) AS row_count FROM users UNION ALL SELECT 'projects', COUNT(*) FROM projects UNION ALL SELECT 'test_runs', COUNT(*) FROM test_runs UNION ALL SELECT 'audit_logs', COUNT(*) FROM audit_logs" \
            > .ci/artifacts/table_counts.tsv
          exit 0

      - name: Stop web application
        if: always()
        run: |
          if [[ -f .ci/server.pid ]]; then
            kill "$(cat .ci/server.pid)" 2>/dev/null || true
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            web/.ci/artifacts/**
            web/test-results/**
            web/playwright-report/**
