name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yaml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: the_test_ci
          MARIADB_USER: the_test
          MARIADB_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        shell: bash
        working-directory: web

    env:
      CI: "true"
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: "3000"
      COOKIE_SECURE: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: the_test_ci
      DB_USER: the_test
      DB_PASSWORD: ci-db-password
      DB_ROOT_HOST: 127.0.0.1
      DB_ROOT_PORT: "3306"
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ci-root-password
      INITIAL_ADMIN_USERNAME: ci-e2e-admin
      INITIAL_ADMIN_PASSWORD: ci-e2e-password
      E2E_USERNAME: ci-e2e-admin
      E2E_PASSWORD: ci-e2e-password
      E2E_BASE_URL: http://127.0.0.1:3000
      EVIDENCE_STORAGE_PATH: ${{ github.workspace }}/web/.ci/evidence
      VIEW_IMAGE_PENDING_TTL_SECONDS: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ONE_OFF_PATCH_START
      - name: Apply one-off maintenance patch
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin agent/folder-explorer-p2
          git checkout -B agent/folder-explorer-p2 origin/agent/folder-explorer-p2
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'web/src/client/OperationsWorkspaceV2.tsx';
          let source = fs.readFileSync(sourcePath, 'utf8');

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`Could not find ${label}`);
            if (text.indexOf(before, first + before.length) >= 0) throw new Error(`Found multiple ${label} matches`);
            return text.slice(0, first) + after + text.slice(first + before.length);
          }

          source = replaceOnce(
            source,
            '  const [selectedCaseId, setSelectedCaseId] = useState(runCases[0]?.id ?? "");\n  const [evidence, setEvidence] = useState<EvidenceRow[]>([]);',
            '  const [selectedCaseId, setSelectedCaseId] = useState(runCases[0]?.id ?? "");\n  const activeCaseId = runCases.some((item) => item.id === selectedCaseId) ? selectedCaseId : runCases[0]?.id ?? "";\n  const refreshSequence = useRef(0);\n  const [evidence, setEvidence] = useState<EvidenceRow[]>([]);',
            'evidence case selection state',
          );

          const refreshPattern = /  async function refresh\(\) \{[\s\S]*?  useEffect\(\(\) => \{ void refresh\(\); \}, \[projectId, runId, selectedCaseId\]\);\n/;
          const refreshReplacement = `  async function refresh() {
            const sequence = ++refreshSequence.current;
            if (!activeCaseId) { setEvidence([]); setMessage(""); return; }
            try {
              const scopeQuery = \`projectId=\${encodeURIComponent(projectId)}&testRunId=\${encodeURIComponent(runId)}&runCaseId=\${encodeURIComponent(activeCaseId)}\`;
              const data = await request<{ evidence: EvidenceRow[] }>(\`/api/evidence?\${scopeQuery}\`);
              if (sequence !== refreshSequence.current) return;
              setEvidence(data.evidence);
              setMessage("");
            } catch (error) {
              if (sequence !== refreshSequence.current) return;
              setMessage(errorText(error, "証跡を取得できませんでした。"));
            }
          }
          useEffect(() => {
            if (selectedCaseId !== activeCaseId) setSelectedCaseId(activeCaseId);
          }, [activeCaseId, selectedCaseId]);
          useEffect(() => { void refresh(); }, [projectId, runId, activeCaseId]);
`;
          if (!refreshPattern.test(source)) throw new Error('Could not find evidence refresh block');
          source = source.replace(refreshPattern, refreshReplacement);

          source = replaceOnce(
            source,
            '      const runCaseId = runCases.length === 1 ? runCases[0]!.id : selectedCaseId;',
            '      const runCaseId = activeCaseId;',
            'evidence upload run case selection',
          );
          source = replaceOnce(source, '    if (!item.file || !selectedCaseId) return;', '    if (!item.file || !activeCaseId) return;', 'clipboard case guard');
          source = replaceOnce(source, '      form.append("runCaseId", selectedCaseId);', '      form.append("runCaseId", activeCaseId);', 'clipboard case form field');
          source = replaceOnce(source, '<select value={selectedCaseId} onChange={(event) => setSelectedCaseId(event.target.value)}>', '<select value={activeCaseId} onChange={(event) => setSelectedCaseId(event.target.value)}>', 'evidence case select');
          source = source.replaceAll('disabled={!selectedCaseId || uploading}', 'disabled={!activeCaseId || uploading}');
          source = replaceOnce(source, 'disabled={!description.trim() || !selectedCaseId || uploading}', 'disabled={!description.trim() || !activeCaseId || uploading}', 'clipboard upload button state');
          fs.writeFileSync(sourcePath, source);

          const e2ePath = 'web/e2e/completed-run-evidence.spec.ts';
          const e2e = `import { expect, test, type Page } from "@playwright/test";
          import { archiveProject, assertE2EConfiguration, createStartedRun, login, unique } from "./helpers.js";

          test.beforeEach(() => assertE2EConfiguration());

          async function completeCurrentRun(page: Page): Promise<void> {
            await page.getByLabel("結果").selectOption("pass");
            await page.getByRole("button", { name: "保存", exact: true }).click();
            await expect(page.getByText("保存済み")).toBeVisible();
            await page.getByRole("button", { name: "実行を完了" }).click();
            await expect(page.getByText("実行を完了しました。")).toBeVisible();
          }

          test("完了済み実行を切り替えても以前の実行ケースで証跡を取得しない", async ({ page }) => {
            await login(page);
            const { projectName, runName, testName } = await createStartedRun(page);
            await completeCurrentRun(page);

            const secondRunName = unique("E2E 完了済み証跡切替");
            await page.getByRole("button", { name: "＋ 新しい実行" }).click();
            await page.getByLabel("実行名").fill(secondRunName);
            await page.getByLabel(testName).check();
            await page.getByRole("button", { name: "保存", exact: true }).click();
            await page.getByRole("button", { name: "開始" }).click();
            await expect(page.getByText("実行を開始しました。")).toBeVisible();
            await completeCurrentRun(page);

            const failedEvidenceRequests: string[] = [];
            page.on("response", (response) => {
              const url = new URL(response.url());
              if (url.pathname === "/api/evidence" && response.status() >= 400) {
                failedEvidenceRequests.push(\`${response.status()} \${url.search}\`);
              }
            });

            const runList = page.locator(".run-list");
            await runList.getByRole("button").filter({ hasText: runName }).click();
            await expect(page.getByRole("heading", { name: "証跡" })).toBeVisible();
            await page.waitForTimeout(400);
            await runList.getByRole("button").filter({ hasText: secondRunName }).click();
            await expect(page.getByRole("heading", { name: "証跡" })).toBeVisible();
            await page.waitForTimeout(400);

            await expect(page.getByText("実行ケースがプロジェクトに存在しません。", { exact: false })).toHaveCount(0);
            expect(failedEvidenceRequests).toEqual([]);
            await archiveProject(page, projectName);
          });
          `;
          fs.writeFileSync(e2ePath, e2e.replace(/^          /gm, ''));

          const packagePath = 'web/package.json';
          const packageJson = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          delete packageJson.overrides?.minimatch;
          delete packageJson.overrides?.['brace-expansion'];
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

      - name: Refresh audited lockfile
        run: npm audit fix --package-lock-only || true
      # ONE_OFF_PATCH_END

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare artifact directories
        run: |
          mkdir -p .ci/evidence .ci/artifacts
          rm -rf test-results playwright-report

      - name: TypeCheck
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: MariaDB integration tests
        env:
          DB_INTEGRATION_TEST: "1"
        run: >-
          npm test --
          src/server/mariaDb.integration.test.ts
          src/server/migrationCollation.integration.test.ts

      - name: Build
        run: npm run build

      - name: Start web application
        run: |
          nohup npm run dev > .ci/artifacts/server.log 2>&1 &
          echo $! > .ci/server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .ci/server.pid)" 2>/dev/null; then
              cat .ci/artifacts/server.log
              exit 1
            fi
            sleep 1
          done
          cat .ci/artifacts/server.log
          exit 1

      - name: Complete initial password setup
        run: bash scripts/ci/bootstrap-e2e-user.sh

      - name: Chromium E2E
        run: npx playwright test --workers=1 --forbid-only --reporter=line,html

      # ONE_OFF_COMMIT_START
      - name: Commit verified maintenance patch
        working-directory: ${{ github.workspace }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/web-ci.yaml';
          let workflow = fs.readFileSync(path, 'utf8');
          workflow = workflow.replace('permissions:\n  contents: write', 'permissions:\n  contents: read');
          workflow = workflow.replace(/      # ONE_OFF_PATCH_START[\s\S]*?      # ONE_OFF_PATCH_END\n\n/, '');
          workflow = workflow.replace(/      # ONE_OFF_COMMIT_START[\s\S]*?      # ONE_OFF_COMMIT_END\n\n/, '');
          fs.writeFileSync(path, workflow);
          NODE
          rm -f .github/workflows/apply-maintenance-fixes.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix completed-run evidence selection and dependency audit"
          git push origin HEAD:agent/folder-explorer-p2
      # ONE_OFF_COMMIT_END

      - name: Export DB and audit evidence
        if: always()
        run: |
          set +e
          mariadb-dump \
            --host=127.0.0.1 --port=3306 \
            --user=the_test --password=ci-db-password \
            --single-transaction --skip-comments \
            the_test_ci > .ci/artifacts/the_test_ci.sql

          mariadb \
            --host=127.0.0.1 --port=3306 \
            --user=the_test --password=ci-db-password \
            --batch --raw --database=the_test_ci \
            --execute="SELECT occurred_at, username, project_id, action, entity_type, entity_id, request_id, success, error_code FROM audit_logs ORDER BY occurred_at" \
            > .ci/artifacts/audit_logs.tsv

          mariadb \
            --host=127.0.0.1 --port=3306 \
            --user=the_test --password=ci-db-password \
            --batch --raw --database=the_test_ci \
            --execute="SELECT 'users' AS table_name, COUNT(*) AS row_count FROM users UNION ALL SELECT 'projects', COUNT(*) FROM projects UNION ALL SELECT 'test_runs', COUNT(*) FROM test_runs UNION ALL SELECT 'audit_logs', COUNT(*) FROM audit_logs" \
            > .ci/artifacts/table_counts.tsv
          exit 0

      - name: Stop web application
        if: always()
        run: |
          if [[ -f .ci/server.pid ]]; then
            kill "$(cat .ci/server.pid)" 2>/dev/null || true
          fi

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            web/.ci/artifacts/**
            web/test-results/**
            web/playwright-report/**