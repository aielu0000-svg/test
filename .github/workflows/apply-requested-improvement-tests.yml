name: Apply requested improvement tests

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/apply-requested-improvement-tests.yml
      - .github/scripts/apply_requested_improvement_tests.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0
      - name: Apply test patch
        run: python .github/scripts/apply_requested_improvement_tests.py
      - name: Validate diff
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify static test code
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx playwright test --list
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/e2e/helpers.ts web/e2e/workflow-guidance.spec.ts web/e2e/requested-improvements.spec.ts
          git commit -m "Add regression coverage for requested improvements"
          git push origin HEAD:agent/folder-explorer-p2
