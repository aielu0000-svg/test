name: Finalize Review 10 Ledgers

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/finalize-review10-ledgers.yaml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
      - name: Update Review 10 records
        run: |
          python3 - <<'PY'
          from pathlib import Path

          task_path = Path('docs/TASK_LOG.md')
          task = task_path.read_text()
          marker = '## TASK-20260806-001: Review 10全体修正\n'
          if marker not in task:
              raise SystemExit('Review 10 task marker missing')
          prefix = task.split(marker, 1)[0]
          finalized = '''## TASK-20260806-001: Review 10全体修正

- 開始日時: 2026-08-06 02:01 JST
- 完了日時: 2026-08-06 10:26 JST
- 対応課題: ISSUE-20260806-001〜004
- 対象: Pull Request #2 / `agent/folder-explorer-p2` → `codex/web-review`
- 担当: ChatGPT
- 状態: Completed

### 発生事象

- 別チャットで追加されたプロジェクト削除処理が、DELETE 404を成功扱いし、ブラウザ内だけでカードを非表示にしていた。
- 全体レビューで削除、監査、ファイル、保持、バックアップ、実行状態、認証、import、Migration、UI試験を横断する50項目を抽出した。
- 広範囲パッチの初回反映では新規6ファイルが欠落し、その後もMariaDB Migration、request transaction、バックアップ復元、保持SQL、証跡XHRのCSRFヘッダーで段階的にCI失敗が判明した。

### 実施内容

- ユーザー判定に従いREV-031〜033を仕様として維持し、それ以外を指定された仕様変更込みで修正した。
- プロジェクト削除を復元なしの完全削除に変更し、監査保持、任意理由、DB/API一意名称、再読込・API・DBを確認する回帰試験へ置換した。
- 変更要求単位のDB transaction、同一transaction監査、rollback時ファイル補償、再試行可能なfile cleanup queueを追加した。
- request単位のAsyncLocalStorage contextを導入し、並行更新でもtransaction接続を正しく解放するようにした。
- バックアップ・復元・保持処理、管理者運用画面、completed結果制約、最後の管理者保護、import競合、Migration checksum/lock、JSON破損検知、snapshot一括処理を修正した。
- DB Migration専用CLIを追加し、3世代作成、正常2世代保持、checksum、DB・証跡同世代復元、復元前バックアップ、保持期限SQLをCIで検証した。
- 証跡アップロード用XHRへ`X-The-Test-Request: 1`を付与し、画面説明を1要求1ファイル・最大100 MiBへ統一した。
- 確定仕様v1.2.0、Issue Ledger、Open Issues、運用文書、OpenShift定義、独立CI工程を更新した。

### 独立検証結果

GitHub Actions run `31062560323`:

- Docker Compose展開: 成功
- OpenShift Kustomize生成: 成功
- `npm ci` / `npm audit --audit-level=high`: 脆弱性0件
- TypeCheck: 成功
- Unit/API: 49件成功、2件skip
- MariaDB 11.4統合: 2件成功
  - 異なる既定照合順序でのMigration
  - 同名プロジェクト並行作成の409拒否
  - 監査失敗時の業務更新rollback
  - 最後の有効管理者保護
  - completedの最終4状態制約
  - プロジェクト完全削除
- Migration CLI: 成功
- バックアップ・復元・保持: 成功
  - 3世代作成後に正常2世代保持
  - DB、証跡、manifestのchecksum確認
  - DBと証跡の同一世代復元
  - 復元前世代を含む2世代カタログ正規化
  - 保持期限SQLとファイル回収キュー
- Production Build: 成功
- OpenShift互換コンテナBuild: 成功
- UID `1000780000:0`・read-only root filesystemでreadiness成功
- Chromium E2E: 19件成功
  - 完全削除、completed後編集、証跡アップロード、画像・Excel、409復旧を含む
- DBダンプ、監査ログ、テーブル件数、Playwrightレポート: 保存成功
- Artifact: `web-ci-31062560323-1`（ID `8952679751`、SHA256 `22eac1a3e49e2fd858b995b8cc9a44397bcdca1a9ed27ca16041436fa5f939d4`）

### 結果

- ISSUE-20260806-001〜004を`Verified`へ変更した。
- Review 10の仕様判定と修正対象を実装し、実MariaDB、実Chromium、OpenShift相当の任意UIDコンテナで回帰確認した。
- PR #2はDraft・未マージのまま維持した。
'''
          task_path.write_text(prefix + finalized)

          ledger_path = Path('docs/ISSUE_LEDGER.md')
          lines = ledger_path.read_text().splitlines()
          verification = {
              'ISSUE-20260806-001': 'GitHub Actions run `31062560323`で同名並行作成409、完全削除、管理画面E2Eを含む全工程成功。',
              'ISSUE-20260806-002': '同runで監査失敗rollback、ファイル補償、証跡アップロード、Unit/API・MariaDB・Chromiumが成功。',
              'ISSUE-20260806-003': '同runで3世代作成、正常2世代保持、checksum、DB・証跡復元、保持SQL、任意UID起動が成功。',
              'ISSUE-20260806-004': '同runでUnit/API 49件、MariaDB統合2件、Chromium E2E 19件を含む全回帰が成功。',
          }
          seen = set()
          for index, line in enumerate(lines):
              parts = line.split('|')
              if len(parts) >= 12 and parts[1].strip() in verification:
                  issue_id = parts[1].strip()
                  parts[5] = ' Verified '
                  parts[9] = f' {verification[issue_id]} '
                  lines[index] = '|'.join(parts)
                  seen.add(issue_id)
          if seen != set(verification):
              raise SystemExit(f'Review 10 ledger rows missing: {set(verification) - seen}')
          ledger_path.write_text('\n'.join(lines) + '\n')

          open_path = Path('docs/OPEN_ISSUES.md')
          opened = open_path.read_text()
          old = 'Review 10で検出した製品不具合は修正実装済みで、独立CIによる検証待ち。対象はISSUE-20260806-001〜004。検証完了までは未解決扱いとする。'
          new = 'Review 10で検出した製品不具合（ISSUE-20260806-001〜004）は修正・独立検証済みで、未解決の製品不具合はありません。'
          if old not in opened:
              raise SystemExit('Open Issues Review 10 status marker missing')
          opened = opened.replace(old, new, 1)
          completed_marker = '## Completed verification\n\n'
          completed_entry = '- Review 10（ISSUE-20260806-001〜004）: GitHub Actions run `31062560323`でUnit/API 49件、MariaDB統合2件、バックアップ・復元・正常2世代保持、OpenShift任意UID起動、Chromium E2E 19件を含む全工程成功。Artifact ID `8952679751`。\n\n'
          if completed_entry not in opened:
              if completed_marker not in opened:
                  raise SystemExit('Completed verification marker missing')
              opened = opened.replace(completed_marker, completed_marker + completed_entry, 1)
          open_path.write_text(opened)

          readme_path = Path('web/README.md')
          readme = readme_path.read_text()
          section = '''
## Review 10独立検証

GitHub Actions run `31062560323`で、TypeCheck、Unit/API 49件、MariaDB統合2件、バックアップ・復元・正常2世代保持、Production Build、OpenShift任意UID・read-only root filesystem起動、Chromium E2E 19件が成功しています。検証成果物はArtifact `web-ci-31062560323-1`（ID `8952679751`）です。
'''
          if '## Review 10独立検証' not in readme:
              readme_path.write_text(readme.rstrip() + '\n' + section)
          PY
          git diff --check
      - name: Commit records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/TASK_LOG.md docs/ISSUE_LEDGER.md docs/OPEN_ISSUES.md web/README.md
          git commit -m "Record Review 10 verification"
          git push origin HEAD:agent/folder-explorer-p2
