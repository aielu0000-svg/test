name: Finalize Review 10 Ledgers

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/finalize-review10-ledgers.yaml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
      - name: Update records
        run: python3 .github/scripts/finalize_review10.py
      - name: Validate changes
        run: git diff --check
      - name: Commit records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/TASK_LOG.md docs/ISSUE_LEDGER.md docs/OPEN_ISSUES.md web/README.md
          git commit -m "Record Review 10 verification"
          git push origin HEAD:agent/folder-explorer-p2
