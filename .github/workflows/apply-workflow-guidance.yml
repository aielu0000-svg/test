name: Apply workflow guidance improvements

on:
  push:
    branches:
      - agent/folder-explorer-p2
    paths:
      - .github/workflows/apply-workflow-guidance.yml
      - .github/scripts/apply_workflow_guidance.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply focused workflow improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_workflow_guidance.py')
          content = path.read_text(encoding='utf-8')
          old = "replace_once(operations, '  const [selectedId, setSelectedId] = useState(\"\");', '  const [selectedId, setSelectedId] = useState(initialRunId ?? \"\");')"
          new = "write(operations, read(operations).replace('  const [selectedId, setSelectedId] = useState(\"\");', '  const [selectedId, setSelectedId] = useState(initialRunId ?? \"\");', 1))"
          if old not in content:
              raise SystemExit('selectedId patch instruction was not found')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/apply_workflow_guidance.py

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: TypeCheck
        working-directory: web
        run: npm run typecheck

      - name: Unit and API tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            web/src/client/App.tsx \
            web/src/client/Workspace.tsx \
            web/src/client/TestDesignEditor.tsx \
            web/src/client/OperationsWorkspaceV2.tsx \
            web/src/client/runWorkflow.ts \
            web/src/client/runWorkflow.test.ts \
            web/src/client/operations.css \
            web/src/server/routes/runs.ts \
            web/e2e/helpers.ts \
            web/e2e/workflow-guidance.spec.ts \
            docs/ISSUE_LEDGER.md \
            docs/TASK_LOG.md \
            docs/OPEN_ISSUES.md
          git diff --cached --check
          git commit -m "Improve daily test workflow guidance"
          git push origin HEAD:agent/folder-explorer-p2
