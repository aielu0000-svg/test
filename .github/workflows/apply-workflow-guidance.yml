name: Apply workflow guidance improvements

on:
  push:
    branches: [agent/folder-explorer-p2]
    paths:
      - ".github/workflows/apply-workflow-guidance.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/folder-explorer-p2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Apply focused workflow improvements
        shell: bash
        run: |
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:120]}")
              write(path, content.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{path}: regex expected one occurrence, found {count}: {pattern}")
              write(path, updated)

