    );
    await writeAudit(db, request, actor, {
      action: "run_failure_rerun_created", entityType: "test_run", entityId: id, projectId,
      after: { sourceRunId: source.id, caseCount: caseIds.length },
    });
    return { id, caseCount: caseIds.length };
  });

