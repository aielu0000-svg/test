name: the-test

services:
  mariadb:
    image: mariadb:11.4
    container_name: the-test-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_NAME:-the_test}"
      MARIADB_USER: "${DB_USER:-the_test}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-the-test-local-db-password}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-the-test-local-root-password}"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb-admin ping --host=127.0.0.1
          --user="$${MARIADB_USER}"
          --password="$${MARIADB_PASSWORD}"
          --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: the-test-web
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      COOKIE_SECURE: "false"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-the_test}"
      DB_USER: "${DB_USER:-the_test}"
      DB_PASSWORD: "${DB_PASSWORD:-the-test-local-db-password}"
      INITIAL_ADMIN_USERNAME: "${INITIAL_ADMIN_USERNAME:-admin}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-change-me-local-admin}"
      EVIDENCE_STORAGE_PATH: /var/lib/the-test/evidence
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - evidence-data:/var/lib/the-test/evidence

volumes:
  mariadb-data:
  evidence-data:
